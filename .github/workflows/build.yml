name: Build

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build Fabric JAR
        run: gradle build --stacktrace
      - name: Verify packaged Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"; jar tf "$JAR" > jar-contents.txt
          required=('fabric.mod.json' 'happy_ghast_overhaul.mixins.json' 'happy_ghast_overhaul.client.mixins.json' 'com/apm23/happyghastoverhaul/item/MilitaryHarnessItem.class' 'com/apm23/happyghastoverhaul/gameplay/MilitaryHarnessEffects.class' 'com/apm23/happyghastoverhaul/client/render/MilitaryHarnessRenderLayer.class' 'assets/happy_ghast_overhaul/textures/entity/military_harness/military_harness_sentinel.png' 'assets/happy_ghast_overhaul/textures/entity/military_harness/military_harness_reaper.png' 'assets/happy_ghast_overhaul/textures/entity/military_harness/military_harness_sentinel_emissive.png' 'assets/happy_ghast_overhaul/textures/entity/military_harness/military_harness_reaper_emissive.png' 'assets/happy_ghast_overhaul/models/entity/military_harness/final_v2/military_harness_final_v2.hgv2')
          for path in "${required[@]}"; do grep -Fxq "$path" jar-contents.txt || { echo "Missing from JAR: $path"; exit 1; }; done
          ! grep -Fq 'assets/happy_ghast_overhaul/texture_sources/' jar-contents.txt
          ! grep -Fq 'assets/happy_ghast_overhaul/mesh_sources/' jar-contents.txt
      - name: Dedicated Fabric server smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run; printf 'eula=true\n' > run/eula.txt; : > server-smoke.log
          timeout 120s gradle runServer --no-daemon --args='nogui' > server-smoke.log 2>&1 & PID=$!
          for i in $(seq 1 120); do if grep -Eq 'Done \([0-9.]+s\)!|Done \(' server-smoke.log; then kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; exit 0; fi; kill -0 "$PID" 2>/dev/null || { cat server-smoke.log; exit 1; }; sleep 1; done
          cat server-smoke.log; exit 1
      - name: Fabric client launch smoke
        shell: bash
        run: |
          set -euo pipefail
          : > client-smoke.log
          xvfb-run -a timeout 120s gradle runClient --no-daemon > client-smoke.log 2>&1 & PID=$!
          for i in $(seq 1 120); do
            if grep -Eq 'Setting user:|Backend library: LWJGL|OpenAL initialized|Reloading ResourceManager' client-smoke.log; then kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; exit 0; fi
            if grep -Eqi 'Mixin apply failed|MixinTransformerError|Exception in thread "Render thread"|Could not execute entrypoint' client-smoke.log; then cat client-smoke.log; kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; exit 1; fi
            kill -0 "$PID" 2>/dev/null || { cat client-smoke.log; exit 1; }; sleep 1
          done
          cat client-smoke.log; exit 1
      - name: Install visual smoke capture tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick x11-utils
      - name: Capture real six-angle visual smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/screenshots/visual-smoke; rm -f run/screenshots/visual-smoke/*.png
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          level-name=visual-smoke-world
          gamemode=creative
          difficulty=peaceful
          pause-when-empty-seconds=-1
          EOF
          : > visual-server.log; : > visual-client.log; : > xvfb.log
          rm -f visual-server.in; mkfifo visual-server.in; exec 3<>visual-server.in
          gradle runServer --no-daemon --args='nogui' <&3 > visual-server.log 2>&1 & SERVER_PID=$!
          XVFB_PID=''; CLIENT_PID=''
          cleanup() { test -z "${CLIENT_PID}" || kill "$CLIENT_PID" 2>/dev/null || true; test -z "${SERVER_PID}" || kill "$SERVER_PID" 2>/dev/null || true; test -z "${XVFB_PID}" || kill "$XVFB_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 120); do grep -Eq 'Done \([0-9.]+s\)!|Done \(' visual-server.log && break; kill -0 "$SERVER_PID" 2>/dev/null || { cat visual-server.log; exit 1; }; sleep 1; done
          grep -Eq 'Done \([0-9.]+s\)!|Done \(' visual-server.log || { cat visual-server.log; exit 1; }
          DISPLAY_NUM=''
          for n in $(seq 100 199); do if test ! -e "/tmp/.X11-unix/X${n}" && test ! -e "/tmp/.X${n}-lock"; then DISPLAY_NUM="$n"; break; fi; done
          test -n "$DISPLAY_NUM" || { echo 'No free X display'; exit 1; }
          export DISPLAY=":${DISPLAY_NUM}"
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -ac +extension GLX +render -noreset > xvfb.log 2>&1 & XVFB_PID=$!
          for i in $(seq 1 20); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; kill -0 "$XVFB_PID" 2>/dev/null || { cat xvfb.log; exit 1; }; sleep 1; done
          xdpyinfo -display "$DISPLAY" >/dev/null
          JAVA_TOOL_OPTIONS='-DhappyGhastVisualSmokeServer=127.0.0.1:25565 -DhappyGhastVisualSmokeCapture=true' gradle runClient --no-daemon > visual-client.log 2>&1 & CLIENT_PID=$!
          for i in $(seq 1 180); do grep -Eq 'joined the game' visual-server.log && break; if grep -Eqi 'Mixin apply failed|MixinTransformerError|Exception in thread "Render thread"|Could not execute entrypoint|Connection refused' visual-client.log; then cat visual-client.log; exit 1; fi; kill -0 "$CLIENT_PID" 2>/dev/null || { cat visual-client.log; exit 1; }; sleep 1; done
          grep -Eq 'joined the game' visual-server.log || { cat visual-server.log; cat visual-client.log; exit 1; }
          echo 'forceload add 0 0' >&3
          echo 'tp @a 0 101 12 180 0' >&3
          echo 'kill @e[tag=visual_smoke_target]' >&3
          echo 'summon minecraft:happy_ghast 0 100 0 {Tags:["visual_smoke_target"],NoAI:1b,Invulnerable:1b,PersistenceRequired:1b,Rotation:[180f,0f]}' >&3
          sleep 2
          echo 'item replace entity @e[tag=visual_smoke_target,limit=1] armor.body with happy_ghast_overhaul:military_harness' >&3
          echo 'gamemode spectator @a' >&3
          echo 'effect give @a minecraft:night_vision infinite 0 true' >&3
          sleep 3
          capture() { name="$1"; x="$2"; y="$3"; z="$4"; yaw="$5"; pitch="$6"; echo "tp @a ${x} ${y} ${z} ${yaw} ${pitch}" >&3; sleep 2; echo "${name}" > run/visual-smoke-capture.request; for i in $(seq 1 50); do test -s "run/screenshots/visual-smoke/${name}.png" && return 0; sleep 0.1; done; echo "Framebuffer capture timed out: ${name}"; cat visual-client.log; return 1; }
          capture front 0 101 12 180 0
          capture back 0 101 -12 0 0
          capture left -12 101 0 -90 0
          capture right 12 101 0 90 0
          capture top 0 112 0 0 90
          capture bottom 0 88 0 0 -90
          identify run/screenshots/visual-smoke/*.png; echo 'stop' >&3
      - name: Validate six-angle visual smoke output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected=(front back left right top bottom)
          for angle in "${expected[@]}"; do
            file="run/screenshots/visual-smoke/${angle}.png"
            test -s "$file" || { echo "Missing ${angle}.png"; exit 1; }
            mean="$(convert "$file" -colorspace Gray -format '%[fx:mean]' info:)"
            awk -v m="$mean" 'BEGIN { if (m <= 0.002) exit 1 }' || { echo "Black/empty framebuffer capture: ${angle}.png mean=${mean}"; exit 1; }
          done
          echo 'visual-smoke: 6/6 non-black framebuffer captures'
      - name: Upload six-angle visual smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-6-angle
          path: run/screenshots/visual-smoke/*.png
          if-no-files-found: error
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            server-smoke.log
            client-smoke.log
            visual-server.log
            visual-client.log
            xvfb.log
          if-no-files-found: ignore
      - name: Upload Fabric JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: happy-ghast-overhaul-fabric
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
