name: Build

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Fabric JAR
        run: gradle build --stacktrace

      - name: Verify packaged Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" > jar-contents.txt
          required=(
            'fabric.mod.json'
            'happy_ghast_overhaul.mixins.json'
            'com/apm23/happyghastoverhaul/item/MilitaryHarnessItem.class'
            'com/apm23/happyghastoverhaul/gameplay/MilitaryHarnessEffects.class'
            'com/apm23/happyghastoverhaul/mixin/HappyGhastHealthMixin.class'
            'com/apm23/happyghastoverhaul/mixin/HappyGhastSpeedMixin.class'
            'com/apm23/happyghastoverhaul/mixin/LivingEntityDamageMixin.class'
            'com/apm23/happyghastoverhaul/mixin/SnowballMixin.class'
            'data/happy_ghast_overhaul/recipe/military_harness.json'
            'data/minecraft/tags/item/harnesses.json'
            'assets/happy_ghast_overhaul/equipment/military_harness.json'
            'assets/happy_ghast_overhaul/items/military_harness.json'
          )
          for path in "${required[@]}"; do
            grep -Fxq "$path" jar-contents.txt || { echo "Missing from JAR: $path"; exit 1; }
          done

      - name: Dedicated Fabric server smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          : > server-smoke.log
          timeout 120s gradle runServer --no-daemon --args='nogui' > server-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.]+s\)!|Done \(' server-smoke.log; then
              echo 'Fabric server reached ready state.'
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat server-smoke.log
              exit 1
            fi
            sleep 1
          done
          cat server-smoke.log
          exit 1

      - name: Fabric client launch smoke
        shell: bash
        run: |
          set -euo pipefail
          : > client-smoke.log
          xvfb-run -a timeout 120s gradle runClient --no-daemon > client-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do
            if grep -Eq 'Setting user:|Backend library: LWJGL|OpenAL initialized|Reloading ResourceManager' client-smoke.log; then
              echo 'Fabric client reached runtime initialization.'
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              exit 0
            fi
            if grep -Eqi 'Mixin apply failed|MixinTransformerError|Exception in thread "Render thread"|Could not execute entrypoint|happy_ghast_overhaul.*error' client-smoke.log; then
              cat client-smoke.log
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              exit 1
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat client-smoke.log
              exit 1
            fi
            sleep 1
          done
          cat client-smoke.log
          exit 1

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            server-smoke.log
            client-smoke.log
          if-no-files-found: ignore

      - name: Upload Fabric JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: happy-ghast-overhaul-fabric
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
